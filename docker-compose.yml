services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redpanda:
    image: redpandadata/redpanda:v25.1.1
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:19092
    ports:
      - "19092:19092"

  airflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg:/var/lib/postgresql/data

  platform:
    build: .
    environment:
      COMMERCE_DATA_ROOT: /app/data
      REDPANDA_BROKERS: redpanda:19092
    volumes:
      - .:/app
    depends_on:
      - minio
      - redpanda

  dashboard:
    build: .
    command: streamlit run app/streamlit_console.py --server.address=0.0.0.0
    environment:
      COMMERCE_DATA_ROOT: /app/data
    ports:
      - "8501:8501"
    volumes:
      - .:/app

  airflow:
    image: apache/airflow:2.10.5-python3.12
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      COMMERCE_DATA_ROOT: /opt/airflow/project/data
      PYTHONPATH: /opt/airflow/project/src
    ports:
      - "8080:8080"
    volumes:
      - .:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
    depends_on:
      - airflow-postgres

volumes:
  minio_data:
  airflow_pg:
