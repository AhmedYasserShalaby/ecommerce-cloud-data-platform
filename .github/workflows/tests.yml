name: Tests

on:
  push:
    branches: ["main", "Ahmed/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dbt]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest --cov=src/commerce_platform --cov-report=term-missing
      - name: Smoke
        run: commerce-platform smoke --profile ci
      - name: dbt parse
        run: dbt parse --profiles-dir .
        working-directory: dbt/ecommerce_cloud_data_platform
      - name: dbt build
        run: dbt build --profiles-dir .
        working-directory: dbt/ecommerce_cloud_data_platform
      - name: Docker Compose config
        run: docker compose config
