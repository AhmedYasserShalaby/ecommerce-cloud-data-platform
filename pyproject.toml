[project]
name = "ecommerce-cloud-data-platform"
version = "0.1.0"
description = "Hybrid local/AWS-ready ecommerce cloud data platform with batch, streaming, lakehouse layers, observability, and BI console."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "plotly>=6.0",
    "pyarrow>=18.0",
    "pyyaml>=6.0",
    "streamlit>=1.40",
    "tabulate>=0.9",
]

[project.scripts]
commerce-platform = "commerce_platform.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
spark = [
    "pyspark>=3.5",
]
dbt = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]
kafka = [
    "kafka-python>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
